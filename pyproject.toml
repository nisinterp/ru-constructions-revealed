[project]
name = "ru-constructions-revealed"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.2",
  "transformers>=4.40",
  "pymorphy3>=1.2",
  "pymorphy3-dicts-ru",
  "pyyaml>=6.0",
  "requests>=2.31",
  "pandas>=2.2",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.12.5",
  "ty>=0.0.1a18",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "UP",
  "B",
  "SIM",
  "I",
]
ignore = [
  "E501",
]
